<!DOCTYPE HTML>
<html lang="en-US">

<head>

	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- css link -->
	<link rel="icon" type="image/png" sizes="56x56" href="assets/images/fav-icon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">

	<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Satisfy&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

	<style>
		/* --- copied from the original template (custom.css / style.css / style-light.css) --- */

		:root {
			--color-white: #fff;
			--color-btn: #0CB2DB;
			--color-btn1: #1C2D31;
			--text-color: #909DA1;
			--primary-color: #0CB2DB;
			--title-color: #fff;
			--color-black1: #1E1E1E;
			--theme-bg-color: #1C2D31;
			--theme-bg-color2: #122327;
			--theme-bg-color3: #D6EEF3;
			--theme-bg-color4: #EDF5F6;
			--text-font: "Inter", sans-serif;
			--title-font: "Bebas Neue", sans-serif;
			--style-font: "Satisfy", sans-serif;
			--container-width: 1470px;
			--dark-bg-color: #122327;
			--dark-bg-color2: #172A2F;
		}

		html,
		body {
			overflow-x: hidden;
			width: 100%;
			overflow-x: clip;
			margin: 0;
			background: var(--theme-bg-color);
		}

		body {
			font-size: 16px;
			line-height: 26px;
			color: var(--text-color);
			font-weight: 400;
			font-family: var(--text-font);
		}

		p {
			font-size: 16px;
			line-height: 28px;
			color: var(--text-color);
			font-weight: 400;
			font-family: var(--text-font);
			margin: 0;
		}

		h1,
		h2,
		h3,
		h4,
		h5,
		h6 {
			font-size: 80px;
			line-height: 1.2;
			color: var(--title-color);
			font-weight: 800;
			font-family: var(--title-font);
			font-style: normal;
			-webkit-transition: .5s;
			transition: .5s;
			margin: 0;
		}

		h1 { font-size: 80px; }

		a {
			text-decoration: none;
			-webkit-transition: all 0.3s ease-out 0s;
			transition: all 0.3s ease-out 0s;
			color: var(--text-color);
		}

		.align-items-center {
			-ms-flex-align: center !important;
			align-items: center !important;
		}

		.d-flex {
			display: -ms-flexbox !important;
			display: flex !important;
		}

		.container-fluid {
			width: 100%;
			padding-right: 15px;
			padding-left: 15px;
			margin-right: auto;
			margin-left: auto;
		}

		.row {
			display: flex;
			flex-wrap: wrap;
			margin-right: -15px;
			margin-left: -15px;
		}

		.col-lg-3,
		.col-lg-6,
		.col-lg-12 {
			position: relative;
			width: 100%;
			padding-right: 15px;
			padding-left: 15px;
		}

		.auto-container {
			position: static;
			max-width: var(--container-width);
			padding: 0px 15px;
			margin: 0 auto;
			width: 100%;
		}

		.boxed {
			position: relative;
			padding: 30px;
			height: 100%;
			left: 0;
			z-index: 5;
			background: var(--dark-bg-color);
		}

		.boxed.two { z-index: inherit; }

		/* --- Hero Slider (copy of home3 yacht dark) --- */
		.main-slider-wrpper { margin-top: 0; }

		.main-slider-wrpper .slider-section {
			height: 950px;
			position: relative;
			border-radius: 30px;
			overflow: hidden;
		}

		.slider-bg {
			background: url(assets/images/home3/slider-bg.png);
			background-repeat: no-repeat;
			background-position: center center;
			background-size: cover;
			position: absolute;
			height: 100%;
			width: 100%;
		}

		.slider-bg.two {
			background: url(assets/images/home3/slider-two.png);
			background-repeat: no-repeat;
			background-position: center center;
			background-size: cover;
			position: absolute;
			height: 100%;
			width: 100%;
		}

		.slider-section .hero_content h1 {
			font-size: 230px;
			font-weight: 400;
			line-height: 190px;
			-webkit-transition-timing-function: ease;
			transition-timing-function: ease;
			-webkit-transition-duration: 1s;
			transition-duration: 1s;
			-webkit-transition-property: all;
			transition-property: all;
			-webkit-transform: translateY(-100px);
			transform: translateY(-100px);
			opacity: 0;
		}

		.slider-section .hero_content .slider-contect-des {
			font-size: 24px;
			position: relative;
			font-weight: 500;
			color: var(--color-white);
			width: 40%;
			line-height: 34px;
			margin: 10px 0 5px;
			-webkit-transition-timing-function: ease;
			transition-timing-function: ease;
			-webkit-transition-duration: 1s;
			transition-duration: 1s;
			-webkit-transition-property: all;
			transition-property: all;
			-webkit-transform: translateY(100px);
			transform: translateY(100px);
			opacity: 0;
		}

		.slider-section .defult-btn a {
			-webkit-transition-timing-function: ease;
			transition-timing-function: ease;
			-webkit-transition-duration: 1s;
			transition-duration: 1s;
			-webkit-transition-property: all;
			transition-property: all;
			-webkit-transform: translateY(100px);
			transform: translateY(100px);
			opacity: 0;
		}

		.slider-section .hero_content h1 img.dunas-logo {
			display: inline-block;
			width: 320px;
			height: auto;
			vertical-align: middle;
			margin-right: 10px;
			filter: drop-shadow(0 0 20px rgba(0, 0, 0, 0.35));
		}

		.swiper-slide-active .slider-section .hero_content .slider-contect-des {
			-webkit-transform: translateY(0);
			transform: translateY(0);
			opacity: 1;
		}

		.swiper-slide-active .slider-section .hero_content h1 {
			-webkit-transform: translateY(0);
			transform: translateY(0);
			opacity: 1;
		}

		.swiper-slide-active .slider-section .defult-btn a {
			-webkit-transform: translateY(0);
			transform: translateY(0);
			opacity: 1;
		}

		.swiper-slide-active .slider-bg { animation: zoomAnimation 20s infinite; }

		@keyframes zoomAnimation {
			0% { transform: scale(1); }
			50% { transform: scale(1.5); }
			100% { transform: scale(1); }
		}

		.circle__video {
			position: absolute;
			width: 164px;
			height: 164px;
			line-height: 164px;
			background: rgba(53, 90, 105, 0.75);
			border-radius: 50%;
			text-align: center;
			margin: auto;
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			left: 38%;
			top: 14%;
			z-index: 20;
			overflow: visible;
		}

		.circle__video svg {
			width: 100%;
			height: 100%;
			overflow: visible !important;
		}

		.circle__video text {
			fill: #ffffff;
			font-size: 20px;
			font-family: var(--title-font, 'Outfit', sans-serif);
			font-weight: 700;
			letter-spacing: 2.5px;
			text-transform: uppercase;
			dominant-baseline: middle;
		}

		.circle__video .rotate-text {
			animation: rotateText 10s linear infinite;
			transform-origin: 100px 100px !important;
			transform-box: view-box;
		}

		.circle__video .circle-vide_btn {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			text-decoration: none;
			z-index: 2;
			background: var(--primary-color);
			height: 50px;
			width: 50px;
			border: 0;
			font-size: 18px;
			color: var(--color-white);
		}

		@keyframes rotateText {
			from { transform: rotate(0deg); }
			to { transform: rotate(360deg); }
		}

		.rotate-text {
			animation: rotateText 10s linear infinite;
			transform-origin: 100px 100px !important;
			transform-box: view-box;
		}

		.travel-slider-dots {
			width: 590px !important;
			position: absolute;
			right: 0;
			left: inherit !important;
			bottom: -10px !important;
			display: flex;
			gap: 32px;
			background: var(--dark-bg-color2);
			height: 190px;
			z-index: 1;
			border-radius: 30px 0 0 0;
			padding: 30px 25px 0 26px;
			text-align: left;
		}

		.travel-slider-dots::before {
			position: absolute;
			content: '';
			left: -30px;
			bottom: 6px;
			background: url(assets/images/home3/slider-sp-dark.png);
			height: 34px;
			width: 35px;
		}

		.travel-slider-dots::after {
			position: absolute;
			content: '';
			right: -5px;
			bottom: 184px;
			background: url(assets/images/home3/slider-sp-dark.png);
			height: 35px;
			width: 35px;
		}

		.travel-slider-dots .swiper-pagination-bullet {
			width: 240px;
			height: 140px;
			display: inline-block;
			border-radius: 15px;
			opacity: 1;
			background: url(assets/images/home3/slider-prevew.png);
			background-repeat: no-repeat;
			background-size: cover;
			background-position: center center;
			position: relative;
			z-index: 1;
		}

		.travel-slider-dots .swiper-pagination-bullet::before {
			position: absolute;
			content: '';
			left: -10px;
			top: -10px;
			height: 160px;
			width: 260px;
			border-radius: 20px;
			border: 1px solid #FFFFFF1A;
		}

		.travel-slider-dots .swiper-pagination-bullet-active {
			position: relative;
			z-index: 1;
			background: url(assets/images/home3/slider-prevew2.png);
			background-repeat: no-repeat;
			background-size: cover;
			background-position: center center;
		}

		.travel-slider-dots .swiper-pagination-bullet-active::before { border: 1px solid var(--primary-color); }

		/* --- Default button (defult-btn) --- */
		.defult-btn a {
			display: inline-block;
			background: var(--primary-color);
			font-family: var(--title-font);
			color: var(--color-white);
			font-weight: 500;
			font-size: 18px;
			letter-spacing: 2.3px;
			padding: 15px 40px;
			margin-top: 30px;
			border-radius: 30px;
			transition: 0.5s;
			position: relative;
			z-index: 1;
		}

		.defult-btn a::before {
			position: absolute;
			content: "";
			height: 100%;
			width: 100%;
			background: var(--title-color);
			border-radius: 30px;
			left: 0;
			top: 0;
			bottom: 0;
			right: 0;
			transition: .5s;
			clip-path: polygon(50% 0, 50% 0, 50% 50%, 50% 100%, 50% 100%, 50% 50%);
			z-index: -1;
		}

		.defult-btn a:hover::before { clip-path: polygon(25% -70%, 75% -70%, 120% 50%, 75% 170%, 25% 170%, -20% 50%); }
		.defult-btn a:hover { color: var(--theme-bg-color2); }
		.defult-btn a svg { margin-left: 10px; transition: 0.5s; }
		.defult-btn a:hover svg { filter: brightness(0); }

		/* --- Preloader (copy) --- */
		.preloader {
			position: fixed;
			inset: 0;
			background: var(--dark-bg-color2);
			z-index: 99999;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.loader {
			width: 60px;
			height: 60px;
			border: 4px solid rgba(255, 255, 255, .15);
			border-top-color: var(--primary-color);
			border-radius: 50%;
			animation: spin 1s linear infinite;
		}

		@keyframes spin { to { transform: rotate(360deg); } }

		/* --- fadeInUp keyframe (used by hero button wow effects) --- */
		@keyframes fadeInUp {
			from { opacity: 0; transform: translateY(50px); }
			to { opacity: 1; transform: translateY(0); }
		}

		/* --- Responsive (copy from original responsive.css) --- */
		@media only screen and (max-width: 1600px) {
			.slider-section .hero_content h1 { font-size: 175px; line-height: 130px; }
			.slider-section .hero_content .slider-contect-des { width: 48%; }
		}

		@media only screen and (max-width: 1200px) {
			.slider-section .hero_content h1 { font-size: 140px; line-height: 110px; }
		}

		@media only screen and (max-width: 1024px) {
			.slider-section .hero_content h1 { font-size: 115px; line-height: 95px; }
			.circle__video {
			position: absolute;
			width: 164px;
			height: 164px;
			line-height: 164px;
			background: rgba(53, 90, 105, 0.75);
			border-radius: 50%;
			text-align: center;
			margin: auto;
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			left: 38%;
			top: 14%;
			z-index: 20;
			overflow: visible;
		}
		}

		@media only screen and (max-width: 992px) {
			.slider-section .hero_content h1 { font-size: 125px; line-height: 73px; }
			.main-slider-wrpper .slider-section { height: 700px; }
			.slider-section .hero_content .slider-contect-des { width: 60%; }
			.travel-slider-dots { width: 100% !important; bottom: 0 !important; border-radius: 20px 20px 0 0; height: auto; }
		}

		@media only screen and (max-width: 768px) {
			.circle__video {
			position: absolute;
			width: 164px;
			height: 164px;
			line-height: 164px;
			background: rgba(53, 90, 105, 0.75);
			border-radius: 50%;
			text-align: center;
			margin: auto;
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			left: 38%;
			top: 14%;
			z-index: 20;
			overflow: visible;
		}
			.main-slider-wrpper .slider-section { height: 550px; }
			.slider-section .hero_content h1 { font-size: 95px; line-height: 80px; }
		}

		@media only screen and (max-width: 600px) {
			.slider-section .hero_content h1 img { display: none; }
			.slider-section .hero_content h1 { font-size: 100px; line-height: 100px; }
			.slider-section .hero_content h1:last-of-type { margin-left: 100px; }
			.circle__video {
			position: absolute;
			width: 164px;
			height: 164px;
			line-height: 164px;
			background: rgba(53, 90, 105, 0.75);
			border-radius: 50%;
			text-align: center;
			margin: auto;
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			left: 38%;
			top: 14%;
			z-index: 20;
			overflow: visible;
		}
			.slider-section .hero_content .slider-contect-des { width: 100%; }
			.main-slider-wrpper .slider-section { height: 750px; }
			.travel-slider-dots .swiper-pagination-bullet { width: 100px; height: 90px; }
			.travel-slider-dots .swiper-pagination-bullet::before { height: 110px; }
			.travel-slider-dots { bottom: -45px !important; }
			.travel-slider-dots::before { bottom: 40px; }
		}

		@media only screen and (max-width: 576px) {
			.boxed { padding: 15px; }
			.main-slider-wrpper .slider-section { height: 480px; border-radius: 18px; }
			.slider-section .hero_content h1 { font-size: 58px; line-height: 55px; }
			.slider-section .hero_content .slider-contect-des { font-size: 16px; line-height: 26px; }
			.defult-btn a { font-size: 15px; padding: 12px 26px; }
			.travel-slider-dots { bottom: 0 !important; gap: 16px; }
		}

		.swiper { margin-left: auto; margin-right: auto; position: relative; overflow: hidden; list-style: none; padding: 0; z-index: 1; }
		.swiper-wrapper { position: relative; width: 100%; height: 100%; z-index: 1; display: flex; transition-property: transform; box-sizing: content-box; }
		.swiper-slide { flex-shrink: 0; width: 100%; height: 100%; position: relative; transition-property: transform; }
	</style>

</head>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/SplitText.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/jquery.magnific-popup.min.js"></script>

	<script>
		// --- copied from the original main.js ---
		(function ($) {
			'use strict';

			// Loder
			if ($('.preloader').length) {
				$('.preloader').delay(200).fadeOut(500);
			}

			// Home-3 slider__active js (copy)
			var slider = new Swiper(".slider__active", {
				loop: true,
				autoplay: {
					speed: 3000,
					delay: 10000,
					disableOnInteraction: false,
					autoplay: false,
				},
				effect: "fade",
				navigation: {
					nextEl: '.slider-prev',
					prevEl: '.slider-next',
				},
				pagination: {
					el: '.travel-slider-dots',
					clickable: true,
				},
			});

			// Popup Video
			if ($('.popup-video').length) {
				$('.popup-video').magnificPopup({
					type: 'iframe',
					mainClass: 'mfp-fade',
					removalDelay: 160,
					preloader: false,
					fixedContentPos: true
				});
			}

			// text-anime-3 heading animation (copy from original main.js)
			function initHeadingAnimation() {
				gsap.registerPlugin(ScrollTrigger, SplitText);


				if ($('.text-anime-3').length) {
					let animatedTextElements = document.querySelectorAll('.text-anime-3');

					animatedTextElements.forEach((element) => {
						//Reset if needed
						if (element.animation) {
							element.animation.progress(1).kill();
							element.split.revert();
						}

						element.split = new SplitText(element, {
							type: "lines,words,chars",
							linesClass: "split-line",
						});
						gsap.set(element, { perspective: 400 });

						gsap.set(element.split.chars, {
							opacity: 0,
							x: "50",
						});

						element.animation = gsap.to(element.split.chars, {
							scrollTrigger: { trigger: element, start: "top 90%" },
							x: "0",
							y: "0",
							rotateX: "0",
							opacity: 1,
							duration: 1,
							ease: Back.easeOut,
							stagger: 0.02,
						});
					});
				}
			}

			if (document.fonts && document.fonts.ready) {
				document.fonts.ready.then(() => {
					initHeadingAnimation();
				});
			} else {
				window.addEventListener("load", initHeadingAnimation);
			}

		})(jQuery);
	</script>
